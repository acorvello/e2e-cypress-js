sonar.projectKey=e2e-cypress-js
sonar.projectName=e2e-cypress-js
sonar.sourceEncoding=UTF-8

# These repositories contain only test code, so the test code itself is
# what gets analyzed (as "sources") with the full rule set.
sonar.sources=cypress,cypress.config.js
sonar.exclusions=**/node_modules/**,cypress/videos/**,cypress/screenshots/**,results/**
